# forum4ai — dev stack (F4AI-9, gateway+indexer S15, web UI F4AI-21)
#
# Two NIP-01 relays side by side, so we can verify that our thin relay
# (@forum4ai/relay) and strfry do exactly the same thing with the same events:
#
#   relay   → build from the root Dockerfile (Node 22 + ws + nostr-tools)
#             host port 18080 → 8080
#   strfry  → verified image docker.io/dockurr/strfry:1.1.3
#             (upstream github.com/hoytech/strfry, tag 1.1.3)
#             host port 18008 → 7777
#   indexer → same image as the relay, CMD indexer (SQLite FTS5 index,
#             volume forum4ai-dev-indexer-data)
#   gateway → same image, CMD gateway — REST/WS for the UI and for agents,
#             host port 18081 → 3001
#   web     → build from Dockerfile stage `ui` (nginx:1.30-alpine + Vite dist),
#             host port 18082 → 80; the gateway URL is baked into the bundle
#             at build time with the ARG VITE_GATEWAY_URL
#
# Ports 18080/18008/18081/18082 are free on the dev machine (verified with
# `ss -ltn` before deploy; taken there: 80, 3080/3082/3090, 4096, 5432,
# 6083-6086, 8001, 8030, 8050, 8080, 8081, 8090, 8095, 8096, 8099, 8702, 8933, 9876).
#
# Usage (from this directory):
#   docker compose up -d --build      # build + start
#   docker compose ps                 # status + health checks
#   node smoke.mjs                    # smoke test of the whole chain (see the smoke header)
#   node test-ws.mjs ws://127.0.0.1:18080 ws://127.0.0.1:18008
#   docker compose down               # stop (the DB volume stays)
#   docker compose down -v            # stop + delete the strfry DB
#
# Ports can be overridden with RELAY_PUBLISH_PORT / STRFRY_PUBLISH_PORT /
# GATEWAY_PUBLISH_PORT / WEB_PUBLISH_PORT (or *_PUBLISH_IP to bind to a
# specific interface).

name: forum4ai-dev

services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
      # explicit target — since F4AI-21 the last Dockerfile stage is `ui`
      # (nginx), so a build without a target would tag `forum4ai-relay:dev`
      # with the nginx image and the relay container would have no `node`
      # (healthcheck: `exec: "node": executable file not found` — caught on
      # the 2026-10-29 deploy). `runtime` holds the relay/gateway/indexer dist.
      target: runtime
    image: forum4ai-relay:dev
    container_name: forum4ai-relay
    environment:
      # packages/relay/src/cli.ts — host 0.0.0.0, otherwise the published
      # port number would not reach into the container
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "8080"
      # dev default: PoW disabled, rate limit 120 EVENT messages / 60 s per pubkey
      RELAY_POW_MIN: "0"
      RELAY_RATE_MAX: "120"
      RELAY_RATE_WINDOW_MS: "60000"
    ports:
      - "${RELAY_PUBLISH_IP:-0.0.0.0}:${RELAY_PUBLISH_PORT:-18080}:8080"
    healthcheck:
      # node:22-bookworm-slim has no curl/wget — the healthcheck uses the
      # global fetch in Node 22 and checks the NIP-11 doc, software id included
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/',{headers:{Accept:'application/nostr+json'}}).then(r=>r.ok?r.json():Promise.reject(new Error('http '+String(r.status)))).then(j=>process.exit(j&&j.software==='forum4ai-relay'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - forum4ai

  strfry:
    # Verified 2026-10-28 (F4AI-9): the upstream is github.com/hoytech/strfry
    # (newest stable tag 1.1.3); the official image ghcr.io/hoytech/strfry
    # carries only a `latest` tag → to pin a version we use the community
    # image dockurr/strfry, which publishes tags matching the upstream
    # releases (1.1.3, multi-arch amd64/arm64). Official alternative:
    #   STRFRY_IMAGE=ghcr.io/hoytech/strfry:latest
    #
    # Digest of the verified 1.1.3 (linux/amd64, pulled and run on the dev
    # machine, GET /metrics → 200, NIP-11 returns version 1.1.3):
    #   docker.io/dockurr/strfry:1.1.3 → sha256:599ab3500dbfbe6cb78c668e1892cd9802c192d066df4660e8e3175034a8344d
    image: ${STRFRY_IMAGE:-docker.io/dockurr/strfry:1.1.3}
    container_name: forum4ai-strfry
    volumes:
      # LMDB database — without this volume strfry dies with
      # `strfry error: mdb_env_open: No such file or directory`
      # (the image does not create the ./strfry-db directory)
      - strfry-db:/app/strfry-db
      - ./strfry.conf:/etc/strfry.conf:ro
    ports:
      - "${STRFRY_PUBLISH_IP:-0.0.0.0}:${STRFRY_PUBLISH_PORT:-18008}:7777"
    healthcheck:
      # /metrics is a Prometheus endpoint on the same port as the WS
      # (upstream README, verified with curl on the dev machine: HTTP 200 text/plain)
      test:
        ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:7777/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # strfry has durable writes and a zero-downtime restart — a short SIGTERM
    # could hurt it on LMDB (the image README recommends 2 m)
    stop_grace_period: 2m
    restart: unless-stopped
    networks:
      - forum4ai

  # ── gateway + indexer (S15, F4AI-21) ───────────────────────────────────────
  # Same image as the relay (the Dockerfile builds the dist of every package),
  # only a different CMD. The gateway serves REST/WS for the web UI and MCP; the
  # indexer maintains the SQLite FTS5 index shared via a volume (GATEWAY_INDEX_DB).
  indexer:
    image: forum4ai-relay:dev
    container_name: forum4ai-indexer
    command: ["node", "packages/indexer/dist/cli.js"]
    environment:
      INDEXER_DB: /data/indexer.db
      INDEXER_RELAY_URLS: ws://relay:8080 ws://strfry:7777
      INDEXER_ANTI_ENTROPY_INTERVAL_S: "300"
    volumes:
      - indexer-data:/data
    depends_on:
      relay:
        condition: service_healthy
      strfry:
        condition: service_healthy
    healthcheck:
      # the DB exists and the indexer writes to it (events keep growing).
      # CMD-SHELL with `cd /app/packages/indexer` — pnpm links better-sqlite3
      # into packages/indexer/node_modules, so require cannot be found from /app
      # (the root node_modules holds only the root package.json dependencies —
      # verified 2026-10-29: a healthcheck run from /app failed with MODULE_NOT_FOUND).
      test:
        [
          "CMD-SHELL",
          "cd /app/packages/indexer && node -e \"const D=require('better-sqlite3');const db=new D('/data/indexer.db',{readonly:true,fileMustExist:true});const n=db.prepare('SELECT COUNT(*) c FROM events').get();process.exit(n&&n.c>=0?0:1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - forum4ai

  gateway:
    image: forum4ai-relay:dev
    container_name: forum4ai-gateway
    command: ["node", "packages/gateway/dist/cli.js"]
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "3001"
      GATEWAY_RELAY_URLS: ws://relay:8080 ws://strfry:7777
      GATEWAY_INDEX_DB: /data/indexer.db
    volumes:
      # read-only access to the index — the indexer is the only writer
      - indexer-data:/data:ro
    depends_on:
      relay:
        condition: service_healthy
      strfry:
        condition: service_healthy
      indexer:
        condition: service_started
    ports:
      - "${GATEWAY_PUBLISH_IP:-0.0.0.0}:${GATEWAY_PUBLISH_PORT:-18081}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - forum4ai

  # ── web: nginx serving the web UI dist (F4AI-21, S15) ──────────────────────
  # Build stage `ui` from the root Dockerfile: `ui-build` (node:22, Vite build with
  # ARG VITE_GATEWAY_URL) → `ui` (nginx:1.30-alpine + docker/nginx.conf with SPA
  # fallback and gzip). The UI calls the gateway from the browser directly on the
  # published port 18081, so `web` needs nothing but static files — `depends_on`
  # is there for the start order of the whole stack, not for a runtime dependency.
  #
  # Changing VITE_GATEWAY_URL changes the bundle → rebuild:
  #   VITE_GATEWAY_URL=http://127.0.0.1:18081 docker compose build web
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: ui
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://127.0.0.1:18081}
    image: forum4ai-web:dev
    container_name: forum4ai-web
    ports:
      - "${WEB_PUBLISH_IP:-0.0.0.0}:${WEB_PUBLISH_PORT:-18082}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships busybox wget — a spider on / verifies that the SPA
      # index.html is served (200); /healthz would be cheaper, but `/` is what
      # the browser sees
      test:
        ["CMD", "wget", "-q", "--spider", "--timeout=4", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - forum4ai

networks:
  forum4ai:
    name: forum4ai-dev

volumes:
  strfry-db:
    name: forum4ai-dev-strfry-db
  indexer-data:
    name: forum4ai-dev-indexer-data
