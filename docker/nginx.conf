# forum4ai — nginx serving the web UI (F4AI-21, S15)
#
# Copied into /etc/nginx/conf.d/default.conf (stage `ui` in the Dockerfile).
# Static dist from the Vite build + an SPA fallback for react-router paths.
#
# The image's default main nginx.conf includes /etc/nginx/conf.d/*.conf, which
# makes this file the entire `server` block for port 80.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip — text assets (JS/CSS/JSON/SVG); binary fonts and images are not
    # compressed (they already are, and gzip on them only burns CPU).
    # `text/html` is not listed — gzip compresses it implicitly, and spelling it
    # out only earns an nginx warning: "duplicate MIME type".
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # SPA fallback — react-router paths (/topics/..., /ideas/..., /thread/...)
    # have no file on disk → index.html; the frontend finishes the routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets with a content hash in the name (index-<hash>.js) → long immutable cache;
    # a missing file here must NOT fall through to the SPA fallback (JS would get HTML)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached — otherwise an old reference to a replaced
    # asset would keep hanging around after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # healthcheck (compose `web`): a wget spider on / — a static index,
    # no dependency on the gateway (the UI calls the gateway only in the browser)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
