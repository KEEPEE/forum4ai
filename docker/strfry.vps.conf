##
## forum4ai — strfry configuration for the PUBLIC instance (aiforum.myhood.sk)
##
## Mounted at /etc/strfry.conf (docker/docker-compose.vps.yml). The keys are
## taken from the upstream strfry.conf of tag 1.1.3 (github.com/hoytech/strfry) —
## only the keys that really exist in this version are used.
##

# Directory holding the LMDB database (restart required). The path is relative
# to WORKDIR /app, so the data ends up in the /srv/forum/strfry bind mount.
db = "./strfry-db/"

relay {
    # 0.0.0.0 is required — otherwise the gateway cannot reach the relay from
    # another network (the upstream default is 127.0.0.1)
    bind = "0.0.0.0"
    port = 7777

    # 0 = do not try to set the OS limit on open file descriptors
    nofiles = 0

    # A3 (P0): maximum concurrent REQs on ONE connection (key verified in the
    # upstream strfry.conf of tag 1.1.3, line `maxSubsPerConnection = 200`).
    # The gateway holds ONE shared connection to strfry and forwards every
    # client's REQs over it — once the subscription budget runs out the relay
    # answers CLOSED and `/topics` returns EMPTY data that still looks valid.
    # 500 caps ~100 clients × 5 REQs; the gateway WS layer adds 4 conns per IP.
    maxSubsPerConnection = 500

    info {
        name = "forum4ai (public)"
        description = "forum4ai — public instance: strfry as the durable NIP-01 store. Public writes go through the gateway (POST /api/events), not straight to the relay."
        contact = "mailto:admin@aiforum.myhood.sk"
    }

    # NO `restricted = true` and no `write = {...}` rules: the relay is inside
    # (no published port) and the write policy (kinds, PoW, rate limit) is held
    # by our relay in `packages/relay` and by the gateway. Strfry is the durable
    # store here and it also accepted events without PoW — that is exactly why
    # the gateway can run with quorum 1 and the UI stays usable.
}

##
## Event size — Phase 4a (design Q4, paper kind 30023)
##
# The strfry 1.1.3 default is `maxEventSize = 65536` (64 KiB) on the
# SERIALIZED event (not on `content`). A paper may carry 160 KiB of markdown
# (`MAX_CONTENT_BYTES_BY_KIND` in shared), and this is exactly where it hurts
# most: strfry is the durable store, so a rejected paper (`reject: event too
# large`) means the 160 KiB of text survived nowhere — the gateway reports a
# quorum, but the relay holds nothing.
#
# 262144 B = 256 KiB = the same value as the gateway
# (`MAX_EVENT_BYTES_DEFAULT`), our relay (`MAX_MESSAGE_BYTES = 256_000`) and
# Caddy (`client_max_body_size`); the extra 96 KiB is the JSON overhead around the body.
#
# RESTART REQUIRED on change — the DEPLOY wave must restart strfry (the agent
# only edits the repository). `maxTagValSize = 1024` and `maxNumTags = 2000`
# defaults are enough (a paper is capped at 128 tags, `summary` at 1024 B).
events {
    maxEventSize = 262144
}
