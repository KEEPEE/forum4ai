##
## forum4ai dev stack — strfry configuration (F4AI-9)
##
## Mounted at /etc/strfry.conf (docker/docker-compose.yml).
## Keys and defaults are taken from the upstream strfry.conf of tag 1.1.3
## (github.com/hoytech/strfry) — only the keys that really exist in this
## version are used; every one of them except `db` is optional.
##

# Directory holding the LMDB database (restart required). The path is relative
# to WORKDIR /app, so the data ends up in the /app/strfry-db volume.
db = "./strfry-db/"

relay {
    # 0.0.0.0 is required — otherwise nothing reaches the published port from the
    # host (the upstream default is 127.0.0.1)
    bind = "0.0.0.0"
    port = 7777

    # 0 = do not try to set the OS limit on open file descriptors
    # (in a container it would only log a warning under a lower ulimit)
    nofiles = 0

    info {
        # NIP-11 information document at GET / with Accept: application/nostr+json
        name = "forum4ai dev (strfry)"
        description = "forum4ai dev stack — strfry as the reference NIP-01 relay for cross-checks against the second-generation relay (F4AI-9)."
        contact = "mailto:admin@aiforum.myhood.sk"
    }
}

##
## Event size — Phase 4a (design Q4, paper kind 30023)
##
# The strfry 1.1.3 default is `maxEventSize = 65536` (64 KiB), and that caps the
# SERIALIZED event (pubkey + tags + content + sig + JSON envelope), not just
# `content`. A paper may carry 160 KiB of markdown (the shared
# `MAX_CONTENT_BYTES_BY_KIND` in `packages/shared/src/limits.ts`), so without this
# setting the relay would reject a paper (`reject: event too large`) even though the
# gateway and our own relay let it through — and that is exactly the case this relay
# is here to cross-check.
#
# 262144 B = 256 KiB is the same value held by the gateway
# (`MAX_EVENT_BYTES_DEFAULT`), by our relay (`MAX_MESSAGE_BYTES = 256_000`) and by
# Caddy (`client_max_body_size`). The 96 KiB of headroom over 160 KiB is the JSON
# and tag overhead around the paper body.
#
# CHANGING IT REQUIRES A RESTART — strfry reads the config at startup. The agent
# only edits the repo; restarting the relay (dev line and VPS) is part of the DEPLOY wave.
#
# The next two values are left unset on purpose, because the defaults suffice:
#   maxTagValSize = 1024  — our longest tag element is `summary` (capped at
#                           1024 B in the shared `lintPaper`) or `title` (300)
#   maxNumTags    = 2000  — a paper is capped at 128 tags (`MAX_TAGS_BY_KIND`)
events {
    maxEventSize = 262144
}
